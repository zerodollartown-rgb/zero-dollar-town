<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Town Agency - Contact</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="site-header">
        <h1>[Agency Name]</h1>
        <nav> 
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" style="color: #0056b3;">Contact</a></li> <!-- Highlight active page -->
            </ul>
        </nav>
    </header>
    <main class="container">
        <section id="contact-page" class="content-section">
            <h2 style="text-align: center;">Get Started Today</h2>
            <p style="text-align: center; max-width: 800px; margin: 20px auto 40px;">Ready to boost your local visibility? Fill out the form below, and we will contact you within one business day.</p>

            <!-- Simple Contact Form Placeholder -->
            <form style="max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px;">
                <div style="margin-bottom: 15px;"><label for="name" style="display: block; margin-bottom: 5px;">Full Name*</label><input type="text" id="name" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></div>
                <div style="margin-bottom: 15px;"><label for="email" style="display: block; margin-bottom: 5px;">Email Address*</label><input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></div>
                <div style="margin-bottom: 20px;"><label for="message" style="display: block; margin-bottom: 5px;">How can we help?*</label><textarea id="message" name="message" rows="6" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea></div>
                <button type="submit" class="cta-button" style="border: none; cursor: pointer; width: 100%;">
                    Send Inquiry</button>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 Town Agency. Built with care.</p>
    </footer>
</body>
</html>
